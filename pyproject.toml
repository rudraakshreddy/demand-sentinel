[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demand_sentinel"
version = "1.0.0"
description = "Retail Demand Forecasting & Inventory Risk Monitoring Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Snchakri" }
]
dependencies = [
    "pandas==2.2.3",
    "numpy==1.26.4",
    "pyarrow==17.0.0",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "streamlit==1.37.0",
    "plotly==5.23.0",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2"
]

[project.optional-dependencies]
ml = [
    "scipy==1.14.0",
    "pmdarima==2.0.4",
    "prophet==1.1.6",
    "statsmodels==0.14.4",
    "xgboost==2.1.3",
    "scikit-learn==1.5.2",
    "shap==0.45.1",
    "optuna==3.6.1",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "tqdm==4.66.5"
]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0"
]

[tool.setuptools]
packages = ["src"]
